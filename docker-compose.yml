services:
  postgres:
    image: postgres:16-alpine
    container_name: stockmaster-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: stockmaster_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres/data

  api:
    build: .
    container_name: stockmaster-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/stockmaster_db?schema=public"
      JWT_SECRET: "uma_chave_super_segura"

volumes:
  postgres_data:
